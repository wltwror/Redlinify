<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" fill="none" role="img" aria-label="Redlinify 4-stage collaborative core workflow loop">
  <defs>
    <linearGradient id="wfDarkBg" x1="0" y1="0" x2="1000" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <radialGradient id="wfGlowVioletD" cx="0.12" cy="0.15" r="0.55">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="wfGlowRoseD" cx="0.86" cy="0.82" r="0.55">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="wfGlowSkyD" cx="0.85" cy="0.18" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <pattern id="wfDotsD" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.15" fill="#334155" opacity="0.5" />
    </pattern>
    <linearGradient id="wfRedWordD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="55%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="wfEdgeSkyRoseD" x1="372" y1="134" x2="624" y2="134" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="wfEdgeRoseVioletD" x1="796" y1="208" x2="796" y2="292" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="wfEdgeRedlineD" x1="628" y1="364" x2="376" y2="364" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="45%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="wfEdgeSyncD" x1="204" y1="296" x2="204" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <marker id="wfArrRoseD" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#f43f5e" />
    </marker>
    <marker id="wfArrVioletD" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#a78bfa" />
    </marker>
    <marker id="wfArrSkyD" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Obsidian blueprint tile matching logo-mark.svg -->
  <rect x="4" y="4" width="992" height="452" rx="24" fill="url(#wfDarkBg)" stroke="#1e293b" stroke-width="2" />
  <rect x="4" y="4" width="992" height="452" rx="24" fill="url(#wfGlowVioletD)" />
  <rect x="4" y="4" width="992" height="452" rx="24" fill="url(#wfGlowSkyD)" />
  <rect x="4" y="4" width="992" height="452" rx="24" fill="url(#wfGlowRoseD)" />
  <rect x="16" y="16" width="968" height="428" rx="18" fill="url(#wfDotsD)" />

  <!-- Top Header Strip -->
  <g transform="translate(36, 19) scale(0.24)">
    <rect x="4" y="4" width="120" height="120" rx="28" fill="#0b1120" stroke="#334155" stroke-width="3" />
    <rect x="20" y="20" width="50" height="38" rx="8" fill="#18143a" stroke="#8b5cf6" stroke-width="4" />
    <rect x="58" y="70" width="50" height="38" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
    <rect x="92" y="76.5" width="10" height="5.5" rx="2.75" fill="#f59e0b" />
    <path d="M70 39 H80 Q86 39 86 45 V65" stroke="#fb7185" stroke-width="5" stroke-linecap="round" />
    <circle cx="86" cy="48" r="6" fill="#f43f5e" />
  </g>
  <text x="76" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.6">
    <tspan fill="url(#wfRedWordD)">Red</tspan><tspan fill="#f8fafc">linify</tspan>
  </text>
  <rect x="76" y="45" width="36" height="2.2" rx="1.1" fill="#f43f5e" opacity="0.9" />
  <circle cx="116" cy="46.1" r="1.8" fill="#fb7185" />
  <text x="172" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#94a3b8">CORE WORKFLOW LOOP</text>

  <!-- Right Legend Pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600">
    <rect x="586" y="22" width="110" height="24" rx="12" fill="#18143a" stroke="#8b5cf6" stroke-opacity="0.55" stroke-width="1" />
    <circle cx="601" cy="34" r="3.5" fill="#a78bfa" />
    <text x="611" y="38" fill="#ddd6fe">Violet Lock</text>

    <rect x="706" y="22" width="136" height="24" rx="12" fill="#1c1917" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1" />
    <circle cx="721" cy="34" r="3.5" fill="#fbbf24" />
    <text x="731" y="38" fill="#fde68a">Amber Question</text>

    <rect x="852" y="22" width="112" height="24" rx="12" fill="#1f1224" stroke="#f43f5e" stroke-opacity="0.6" stroke-width="1" />
    <circle cx="867" cy="34" r="3.5" fill="#fb7185" />
    <text x="877" y="38" fill="#ffe4e6">Redline Diff</text>
  </g>

  <!-- Secondary faint dashed blueprint lines linking all 4 stages to shared .design/ hub -->
  <path d="M 356 208 V 252 H 394" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.4" stroke-dasharray="4 4" stroke-linecap="round" />
  <path d="M 644 208 V 252 H 606" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.4" stroke-dasharray="4 4" stroke-linecap="round" />
  <path d="M 356 296 V 252 H 394" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.4" stroke-dasharray="4 4" stroke-linecap="round" />
  <path d="M 644 296 V 252 H 606" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.4" stroke-dasharray="4 4" stroke-linecap="round" />

  <!-- CENTER HUB: .design/ Git Truth -->
  <rect x="396" y="210" width="208" height="84" rx="14" fill="#0b1324" stroke="#10b981" stroke-opacity="0.65" stroke-width="1.5" />
  <rect x="442" y="199" width="116" height="20" rx="10" fill="#064e3b" stroke="#34d399" stroke-opacity="0.7" stroke-width="1" />
  <text x="500" y="212.5" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700" fill="#6ee7b7">.design/ Git Truth</text>
  <text x="500" y="242" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" fill="#f8fafc">views/*.json · threads/*.json</text>
  <text x="500" y="261" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" fill="#94a3b8">Zero pixel x/y coords or zoom</text>
  <text x="500" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" fill="#64748b">gitignored: .layout/ · .checkpoint/</text>

  <!-- CARD 01 (Top-Left): Agent Drafts & Asks -->
  <rect x="36" y="72" width="336" height="136" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <rect x="36" y="72" width="336" height="36" rx="14" fill="#172554" fill-opacity="0.55" />
  <line x1="36" y1="108" x2="372" y2="108" stroke="#1e293b" stroke-width="1" />
  <circle cx="56" cy="90" r="10" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2" />
  <text x="56" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="700" fill="#7dd3fc">01</text>
  <text x="74" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Agent Drafts &amp; Asks</text>
  <rect x="276" y="80" width="82" height="20" rx="10" fill="#0369a1" fill-opacity="0.38" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1" />
  <text x="317" y="93.5" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#7dd3fc">MCP stdio</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#cbd5e1">
    <circle cx="54" cy="130" r="3" fill="#38bdf8" />
    <text x="66" y="134" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e2e8f0">upsert_view() / patch_view()</text>
    <circle cx="54" cy="156" r="3" fill="#38bdf8" />
    <text x="66" y="160">Auto-starts <tspan font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#93c5fd">127.0.0.1:4173</tspan> workbench</text>
    <circle cx="54" cy="182" r="3" fill="#f59e0b" />
    <text x="66" y="186">Pins <tspan fill="#fbbf24" font-weight="600">amber</tspan> questions &amp; awaits reply</text>
  </g>

  <!-- CARD 02 (Top-Right): You Review, Comment & Model (Logo sky+amber card style) -->
  <rect x="628" y="72" width="336" height="136" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <rect x="628" y="72" width="336" height="36" rx="14" fill="#172554" fill-opacity="0.5" />
  <line x1="628" y1="108" x2="964" y2="108" stroke="#1e293b" stroke-width="1" />
  <circle cx="648" cy="90" r="10" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2" />
  <text x="648" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="700" fill="#7dd3fc">02</text>
  <text x="666" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Comment &amp; Model</text>
  <!-- Signature amber pill matching logo bottom-right card -->
  <rect x="862" y="80" width="88" height="20" rx="10" fill="#f59e0b" fill-opacity="0.22" stroke="#f59e0b" stroke-opacity="0.8" stroke-width="1" />
  <circle cx="874" cy="90" r="3" fill="#f59e0b" />
  <text x="912" y="93.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="700" fill="#fde68a">Browser UI</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#cbd5e1">
    <circle cx="646" cy="130" r="3" fill="#f59e0b" />
    <text x="658" y="134">Read agent comments &amp; post replies</text>
    <circle cx="646" cy="156" r="3" fill="#38bdf8" />
    <text x="658" y="160">Add cards, ER fields &amp; drag edge bends</text>
    <circle cx="646" cy="182" r="3" fill="#fb7185" />
    <text x="658" y="186">Pin change requests right onto nodes</text>
  </g>

  <!-- CARD 03 (Bottom-Right): Lock & Record Decisions (Logo Violet Locked Card + Padlock Glyph!) -->
  <rect x="628" y="296" width="336" height="136" rx="14" fill="#18143a" stroke="#8b5cf6" stroke-width="2.2" />
  <rect x="628" y="296" width="336" height="36" rx="14" fill="#2e1065" fill-opacity="0.65" />
  <line x1="628" y1="332" x2="964" y2="332" stroke="#4c1d95" stroke-opacity="0.65" stroke-width="1" />
  <circle cx="648" cy="314" r="10" fill="#7c3aed" fill-opacity="0.35" stroke="#a78bfa" stroke-width="1.2" />
  <text x="648" y="318" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="700" fill="#ddd6fe">03</text>
  <text x="666" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Lock &amp; Decide</text>
  <!-- Violet Locked Pill + Vector Padlock matching logo-mark.svg -->
  <rect x="876" y="304" width="74" height="20" rx="10" fill="#5b21b6" fill-opacity="0.55" stroke="#a78bfa" stroke-width="1" />
  <path d="M887 313 V311 A2.2 2.2 0 0 1 891.4 311 V313" stroke="#ddd6fe" stroke-width="1.4" stroke-linecap="round" />
  <rect x="885.5" y="313" width="7.4" height="5.8" rx="1.4" fill="#c4b5fd" />
  <text x="920" y="317.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="700" fill="#ede9fe">Locked</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#ddd6fe">
    <circle cx="646" cy="354" r="3" fill="#a78bfa" />
    <text x="658" y="358">Lock approved contracts in <tspan fill="#ffffff" font-weight="600">violet</tspan></text>
    <circle cx="646" cy="380" r="3" fill="#a78bfa" />
    <text x="658" y="384">Agent strictly blocked from overwrites</text>
    <circle cx="646" cy="406" r="3" fill="#34d399" />
    <text x="658" y="410">Resolved threads → searchable <tspan fill="#ffffff" font-weight="600">Decisions</tspan></text>
  </g>

  <!-- CARD 04 (Bottom-Left): Semantic Diff & Implement -->
  <rect x="36" y="296" width="336" height="136" rx="14" fill="#0f172a" stroke="#f43f5e" stroke-opacity="0.85" stroke-width="2" />
  <rect x="36" y="296" width="336" height="36" rx="14" fill="#4c0519" fill-opacity="0.4" />
  <line x1="36" y1="332" x2="372" y2="332" stroke="#334155" stroke-width="1" />
  <circle cx="56" cy="314" r="10" fill="#e11d48" fill-opacity="0.3" stroke="#fb7185" stroke-width="1.2" />
  <text x="56" y="318" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="700" fill="#fecdd3">04</text>
  <text x="74" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Semantic Diff &amp; Code</text>
  <rect x="272" y="304" width="86" height="20" rx="10" fill="#881337" fill-opacity="0.5" stroke="#fb7185" stroke-opacity="0.65" stroke-width="1" />
  <text x="315" y="317.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="700" fill="#ffe4e6">Zero Bloat</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#cbd5e1">
    <circle cx="54" cy="354" r="3" fill="#fb7185" />
    <text x="66" y="358"><tspan font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.8" fill="#fda4af">get_pending_feedback()</tspan> → delta only</text>
    <circle cx="54" cy="380" r="3" fill="#34d399" />
    <text x="66" y="384">Builds code &amp; schema from clean graph</text>
    <circle cx="54" cy="406" r="3" fill="#38bdf8" />
    <text x="66" y="410"><tspan font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.8" fill="#93c5fd">sync_code_refs()</tspan> links files to nodes</text>
  </g>

  <!-- CLOCKWISE LOGO-THEMED ORTHOGONAL REDLINE CONNECTORS + BEND DOTS -->
  <!-- 1. Top: 01 -> 02 -->
  <path d="M 372 134 H 621" stroke="url(#wfEdgeSkyRoseD)" stroke-width="2.8" stroke-linecap="round" marker-end="url(#wfArrRoseD)" />
  <rect x="440" y="121" width="126" height="26" rx="13" fill="#0f172a" stroke="#fb7185" stroke-opacity="0.7" stroke-width="1.2" />
  <text x="503" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Live WebSocket</text>
  <circle cx="404" cy="134" r="5" fill="#f43f5e" stroke="#0f172a" stroke-width="2" />
  <circle cx="404" cy="134" r="2" fill="#ffffff" />

  <!-- 2. Right: 02 -> 03 -->
  <path d="M 796 208 V 289" stroke="url(#wfEdgeRoseVioletD)" stroke-width="2.8" stroke-linecap="round" marker-end="url(#wfArrVioletD)" />
  <rect x="730" y="242" width="132" height="26" rx="13" fill="#18143a" stroke="#a78bfa" stroke-opacity="0.75" stroke-width="1.2" />
  <text x="796" y="259" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#ede9fe">Approve &amp; Lock</text>
  <circle cx="796" cy="224" r="5" fill="#f43f5e" stroke="#0f172a" stroke-width="2" />
  <circle cx="796" cy="224" r="2" fill="#ffffff" />

  <!-- 3. Bottom: 03 -> 04 (Signature Redline Return Loop) -->
  <path d="M 628 364 H 379" stroke="url(#wfEdgeRedlineD)" stroke-width="3" stroke-linecap="round" marker-end="url(#wfArrRoseD)" />
  <rect x="415" y="350" width="170" height="28" rx="14" fill="#2a0a18" stroke="#f43f5e" stroke-opacity="0.85" stroke-width="1.4" />
  <text x="500" y="368" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="700" fill="#ffe4e6">Compact Semantic Diff</text>
  <circle cx="604" cy="364" r="5" fill="#f43f5e" stroke="#0f172a" stroke-width="2" />
  <circle cx="604" cy="364" r="2" fill="#ffffff" />

  <!-- 4. Left: 04 -> 01 -->
  <path d="M 204 296 V 215" stroke="url(#wfEdgeSyncD)" stroke-width="2.8" stroke-linecap="round" marker-end="url(#wfArrSkyD)" />
  <rect x="130" y="236" width="148" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.2" />
  <text x="204" y="253" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#e0f2fe">Implement &amp; Sync</text>
  <circle cx="204" cy="280" r="5" fill="#f43f5e" stroke="#0f172a" stroke-width="2" />
  <circle cx="204" cy="280" r="2" fill="#ffffff" />
</svg>
