<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-label="Redlinify mark">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <radialGradient id="glowRose" cx="0.72" cy="0.32" r="0.65">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.25" cy="0.25" r="0.6">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="redlineGrad" x1="68" y1="38" x2="88" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>

  <!-- Base rounded tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#glowViolet)" />
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#glowRose)" />

  <!-- Subtle blueprint dot matrix -->
  <g fill="#334155" opacity="0.55">
    <circle cx="24" cy="24" r="1.2" /><circle cx="44" cy="24" r="1.2" /><circle cx="64" cy="24" r="1.2" /><circle cx="84" cy="24" r="1.2" /><circle cx="104" cy="24" r="1.2" />
    <circle cx="24" cy="44" r="1.2" /><circle cx="44" cy="44" r="1.2" /><circle cx="64" cy="44" r="1.2" /><circle cx="84" cy="44" r="1.2" /><circle cx="104" cy="44" r="1.2" />
    <circle cx="24" cy="64" r="1.2" /><circle cx="44" cy="64" r="1.2" /><circle cx="64" cy="64" r="1.2" /><circle cx="84" cy="64" r="1.2" /><circle cx="104" cy="64" r="1.2" />
    <circle cx="24" cy="84" r="1.2" /><circle cx="44" cy="84" r="1.2" /><circle cx="64" cy="84" r="1.2" /><circle cx="84" cy="84" r="1.2" /><circle cx="104" cy="84" r="1.2" />
    <circle cx="24" cy="104" r="1.2" /><circle cx="44" cy="104" r="1.2" /><circle cx="64" cy="104" r="1.2" /><circle cx="84" cy="104" r="1.2" /><circle cx="104" cy="104" r="1.2" />
  </g>

  <!-- Secondary faint edge connecting bottom-left -->
  <path d="M44 58 V86 Q44 92 50 92 H60" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="3.5 3.5" stroke-linecap="round" />

  <!-- Top-left card: Approved / Locked Violet Node -->
  <rect x="20" y="20" width="50" height="38" rx="8" fill="#18143a" stroke="#8b5cf6" stroke-width="2.4" />
  <rect x="26" y="27" width="22" height="4.5" rx="2.25" fill="#ddd6fe" />
  <rect x="26" y="36" width="36" height="3.5" rx="1.75" fill="#7c3aed" opacity="0.7" />
  <rect x="26" y="43" width="28" height="3.5" rx="1.75" fill="#5b21b6" opacity="0.8" />
  <!-- Lock icon badge -->
  <path d="M57 29.5 V27.5 A2.5 2.5 0 0 1 62 27.5 V29.5" stroke="#c4b5fd" stroke-width="1.6" stroke-linecap="round" />
  <rect x="55.5" y="29.5" width="8" height="6.5" rx="1.5" fill="#a78bfa" />

  <!-- Bottom-right card: Annotated / Needs Input Sky + Amber Node -->
  <rect x="58" y="70" width="50" height="38" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2.4" />
  <rect x="64" y="77" width="24" height="4.5" rx="2.25" fill="#e2e8f0" />
  <!-- Amber question/status pill -->
  <rect x="92" y="76.5" width="10" height="5.5" rx="2.75" fill="#f59e0b" />
  <rect x="64" y="86" width="38" height="3.5" rx="1.75" fill="#475569" />
  <rect x="64" y="93" width="29" height="3.5" rx="1.75" fill="#334155" />

  <!-- Primary Orthogonal Redline Edge with Arrowhead & Interactive Bend Handle -->
  <path d="M70 39 H80 Q86 39 86 45 V65" stroke="url(#redlineGrad)" stroke-width="3.2" stroke-linecap="round" />
  <path d="M81.5 62.5 L86 68 L90.5 62.5" stroke="#fb7185" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Interactive bend node -->
  <circle cx="86" cy="48" r="5" fill="#f43f5e" stroke="#0f172a" stroke-width="2" />
  <circle cx="86" cy="48" r="2" fill="#ffffff" />
</svg>
